name: Limpieza de mascotas vencidas

# Borra cada día los avisos de mascotas vencidos y sus fotos (ver scripts/cleanup-pets.mjs).
# Necesita dos secrets en: Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL          la URL de tu proyecto (https://xxxx.supabase.co)
#   SUPABASE_SERVICE_KEY  la llave "service_role" / "secret" de Supabase (Project Settings → API Keys)
on:
  schedule:
    - cron: '17 8 * * *'          # 08:17 UTC = 03:17 en Bogotá
  workflow_dispatch:               # botón «Run workflow» para probarlo a mano
    inputs:
      dry_run:
        description: 'Simulacro: solo muestra qué borraría, sin borrar nada'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Limpiar avisos y fotos vencidos
        run: node scripts/cleanup-pets.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
